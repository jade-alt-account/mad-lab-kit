# build.yml: builds and tests your Flutter app on GitHub's computers
name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          flutter --version
          flutter create --platforms=android --org pk.student .
          # remove the sample test that 'flutter create' adds
          git ls-files --error-unmatch test/widget_test.dart \
            > /dev/null 2>&1 || rm -f test/widget_test.dart

      - name: Android settings for the plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g = Path('android/app/build.gradle.kts')
          s = g.read_text()
          # the notifications plugin needs Android 17 (API 37) to compile
          s = s.replace('compileSdk = flutter.compileSdkVersion',
                        'compileSdk = maxOf(flutter.compileSdkVersion, 37)')
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n'
                            '        isCoreLibraryDesugaringEnabled = true', 1)
              s += ('\ndependencies {\n    coreLibraryDesugaring('
                    '"com.android.tools:desugar_jdk_libs:2.1.4")\n}\n')
          g.write_text(s)
          m = Path('android/app/src/main/AndroidManifest.xml')
          t = m.read_text()
          if 'POST_NOTIFICATIONS' not in t:
              t = t.replace('<application', '<uses-permission android:name='
                            '"android.permission.POST_NOTIFICATIONS"/>\n'
                            '    <application', 1)
              m.write_text(t)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Run the tests
        run: |
          if ls test/*_test.dart > /dev/null 2>&1; then flutter test
          else echo "No tests yet"; fi

      - name: Build the release (App Bundle and APK)
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Sign the release with your upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
            PW="$KEYSTORE_PASSWORD"
          else
            echo "No keystore secret found: using a temporary PRACTICE key"
            PW=practice123
            keytool -genkeypair -keystore upload.jks -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" \
              -dname "CN=Practice Key, O=Student, C=PK"
          fi
          mkdir -p release
          AAB=build/app/outputs/bundle/release/app-release.aab
          zip -q -d "$AAB" 'META-INF/*'
          jarsigner -keystore upload.jks -storepass "$PW" \
            -signedjar release/app-release.aab "$AAB" upload
          jarsigner -verify release/app-release.aab
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${SIGNER}apksigner" sign --ks upload.jks --ks-pass "pass:$PW" \
            --out release/app-release.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "${SIGNER}apksigner" verify --print-certs release/app-release.apk
          rm upload.jks

      - name: Save the app for your phone
        uses: actions/upload-artifact@v7
        with:
          name: phone-apk
          path: release/app-release.apk

      - name: Save the bundle for Google Play
        uses: actions/upload-artifact@v7
        with:
          name: store-bundle
          path: release/app-release.aab
