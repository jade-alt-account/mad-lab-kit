name: gomal-mad-trial
on:
  push:
    branches: [gomal-mad-trial]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: bash ci/labs.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: labs, path: results/}
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: apks, path: apks/}
  student:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lab: [lab3, lab4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: python3 ci/run_student.py student/${{ matrix.lab }} results/student-${{ matrix.lab }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-${{ matrix.lab }}
          path: results/
  emulator:
    needs: labs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: apks, path: apks}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator.sh ${{ matrix.api }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ matrix.api }}
          path: results/
  publish:
    needs: [labs, student, emulator]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: all}
      - name: Push results to the ci-results-gomal-mad branch
        run: |
          mkdir out
          for d in all/*/; do cp -r "$d"* out/ 2>/dev/null || true; done
          rm -rf out/*.apk
          cd out
          echo "labs: ${{ needs.labs.result }}, student: ${{ needs.student.result }}, emulator: ${{ needs.emulator.result }}" > jobs.txt
          git init -q -b ci-results-gomal-mad
          git config user.name lab-trial; git config user.email lab-trial@users.noreply.github.com
          git add -A; git commit -q -m "Gomal MAD trial ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results-gomal-mad
