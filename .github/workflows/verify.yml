name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  # Builds both starter projects on Linux with the Android SDK the runner already has.
  starters-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build starters
        shell: bash
        run: |
          mkdir -p results
          set -o pipefail
          {
            echo "== starter"; (cd starter && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest)
            echo "== kotlin-starter"; (cd kotlin-starter && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest)
          } 2>&1 | tee results/starters-linux.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starters-linux
          path: results/

  # Follows Lab 0, Part D of the handbook word for word on a fresh Windows machine.
  lab0-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Lab 0 Part D, steps D1 to D5
        shell: pwsh
        run: ./ci/lab0-windows.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab0-windows
          path: results/

  labs-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Lab 12 Part A - run the Notes service as the lab describes
        shell: bash
        run: |
          mkdir -p results/emulator-${{ matrix.api }}
          L=results/emulator-${{ matrix.api }}/lab12.txt
          mkdir -p "$RUNNER_TEMP/notes-api" && cd "$RUNNER_TEMP/notes-api"
          { npm init -y >/dev/null && echo "npm init -y: ok"; npm install express 2>&1 | tail -2; ls; } >> "$GITHUB_WORKSPACE/$L"
          cp "$GITHUB_WORKSPACE/ci/notes-api/server.js" .
          nohup node server.js > server.log 2>&1 &
          sleep 3
          { cat server.log
            echo "GET:";  curl -s http://localhost:3000/api/notes; echo
            echo "POST:"; curl -s -X POST -H "Content-Type: application/json" -d '{"title":"Lab 12","body":"From curl"}' http://localhost:3000/api/notes; echo
            echo "GET 2:"; curl -s http://localhost:3000/api/notes/2; echo
            echo "GET 99:"; curl -s -w " [%{http_code}]" http://localhost:3000/api/notes/99; echo
            echo "POST no title:"; curl -s -w " [%{http_code}]" -X POST -H "Content-Type: application/json" -d '{"body":"x"}' http://localhost:3000/api/notes; echo
            echo "DELETE 2:"; curl -s -w "[%{http_code}]" -X DELETE http://localhost:3000/api/notes/2; echo
            echo "GET after delete:"; curl -s http://localhost:3000/api/notes; echo
          } >> "$GITHUB_WORKSPACE/$L"
      - name: Build all lab apps and tests
        shell: bash
        run: |
          cd ci/labs
          ./gradlew --no-daemon --continue assembleDebug assembleDebugAndroidTest 2>&1 | tee ../../results/emulator-${{ matrix.api }}/build.log | tail -30
      - name: Run lab tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./ci/emulator-tests.sh ${{ matrix.api }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ matrix.api }}
          path: results/
  publish-results:
    if: always()
    needs: [starters-linux, lab0-windows, labs-emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Commit results to the ci-results branch
        shell: bash
        run: |
          cd out
          {
            echo "run: ${GITHUB_RUN_ID} sha: ${GITHUB_SHA}"
            echo "starters-linux: ${{ needs.starters-linux.result }}"
            echo "lab0-windows: ${{ needs.lab0-windows.result }}"
            echo "labs-emulator: ${{ needs.labs-emulator.result }}"
          } > SUMMARY.txt
          git init -q -b ci-results
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
