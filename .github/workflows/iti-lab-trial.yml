name: iti-lab-trial
on:
  push:
    branches: [iti-lab-trial]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils cloud-image-utils
      - name: Run the lab trial in an AlmaLinux 9 VM
        run: bash run.sh
      - name: Save results
        if: always()
        run: |
          cd results
          git init -q -b ci-results-iti
          git config user.name "lab-trial"; git config user.email "lab-trial@users.noreply.github.com"
          git add -A; git commit -q -m "ITI lab trial ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results-iti
